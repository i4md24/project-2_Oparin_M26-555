[project]
name = "primitive-db"
version = "0.1.0"
description = "Консольный эмулятор реляционной базы данных: создание таблиц, CRUD-операции, валидация типов и кэширование запросов."
readme = "README.md"
authors = [
    { name = "Игорь Опарин", email = "i4md24i@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "prompt>=0.4.1",
]

[project.scripts]
project = "primitive_db.main:main"
database = "primitive_db.engine:run"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]